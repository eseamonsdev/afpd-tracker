name: Recover October 20 OpenMHz import

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/recover-openmhz-2026-10-20.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve validated import recovery bundle
        uses: actions/download-artifact@v4
        with:
          name: openmhz-import-recovery-39654683784
          run-id: 39654683784
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/openmhz-recovery
      - name: Restore only the October 20 archive
        run: |
          set -euo pipefail
          archive=public/records/openmhz/openmhz-afpd-car-to-car-2026-10-20
          manifest=records-pending-review/openmhz-manifests/2026-10-20.json
          test -f "$manifest"
          # Refuse to overwrite an archive published since recovery was prepared.
          test ! -e "$archive"
          git bundle verify "$RUNNER_TEMP/openmhz-recovery/openmhz-import.bundle"
          recovery_commit=$(git bundle list-heads "$RUNNER_TEMP/openmhz-recovery/openmhz-import.bundle" | awk '$2 == "HEAD" {print $1}')
          test -n "$recovery_commit"
          git fetch "$RUNNER_TEMP/openmhz-recovery/openmhz-import.bundle" "$recovery_commit"
          git restore --source=FETCH_HEAD --worktree -- "$archive"
      - name: Validate recovery and refresh metadata
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m unittest discover -s tests -p 'test_openmhz*.py'
          python3 scripts/download_openmhz_manifest.py --summary "$RUNNER_TEMP/openmhz-download-summary.json"
          python3 scripts/normalize_openmhz_metadata.py --check
          cat "$RUNNER_TEMP/openmhz-download-summary.json" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'openmhz-download-summary.json').read_text())
          result = next(item for item in summary if item['date'] == '2026-10-20')
          assert result == {'date': '2026-10-20', 'count': 194, 'downloaded': 0, 'skipped_existing': 194}, result
          PY
      - name: Build and verify radio pages
        run: |
          npm ci
          node --test tests/police-radio.test.js
          npm run build
      - name: Publish recovered archive and radio pages on latest staging
        run: |
          # Stage only the archive, derived radio pages, and consumed source manifest.
          git add -A -- public/records/openmhz public/police-radio records-pending-review/openmhz-manifests
          # Drop unrelated generated-page changes from this isolated checkout.
          # Staged radio changes stay intact; current staging profile pages are preserved.
          git restore --worktree -- .
          bash scripts/push_openmhz_import.sh
      - name: Preserve recovered result if publication fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openmhz-import-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/openmhz-import.bundle
          if-no-files-found: warn
          retention-days: 7
