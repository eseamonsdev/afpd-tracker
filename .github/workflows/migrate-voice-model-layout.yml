name: Reorganize R2 voices by model and revision
'on':
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - records-pending-review/voice-model-layout-request.json
permissions:
  contents: read
concurrency:
  group: radio-speaker-processing-staging
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install storage and test dependencies
        run: python -m pip install 'boto3>=1.40,<2' numpy==2.2.6 scipy==1.15.3
      - name: Test storage, incremental extraction, and migration
        run: |
          python -m unittest discover -s tests -p test_voice_storage.py
          python -m unittest discover -s tests -p test_incremental_radio_speakers.py
          python -m unittest discover -s tests -p test_embedding_only.py
          python -m unittest discover -s tests -p test_voice_model_layout.py
      - name: Copy, verify, then remove redundant old objects
        run: python -u scripts/migrate_voice_model_layout.py --apply --remove-old --report voice-model-layout-migration.json
      - name: Save migration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-model-layout-migration
          path: voice-model-layout-migration.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize migration
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('voice-model-layout-migration.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# Model-first voice storage migration\n\n')
              for key in ('status', 'days', 'source_objects', 'destination_objects', 'old_objects_remaining'):
                  f.write(f"- {key}: {report.get(key)}\n")
          PY
