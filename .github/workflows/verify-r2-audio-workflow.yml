name: Verify R2 radio audio workflow
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/verify-r2-audio-workflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'boto3>=1.40,<2'
      - run: npm ci --no-audit --no-fund
      - name: Test downloads, storage integrity, metadata and playback
        run: |
          python -m unittest discover -s tests -p 'test_openmhz*.py'
          python -m unittest discover -s tests -p 'test*radio_transcription*.py'
          node --test tests/police-radio.test.js tests/radio-transcripts.test.js tests/r2-radio-audio.test.js
      - name: Copy and verify one actual recording without changing Git metadata
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from r2_audio import client_and_bucket, upload_one
          client, bucket = client_and_bucket()
          for manifest in sorted(Path('public/records/openmhz').glob('openmhz-afpd-*/calls.json')):
              data = json.loads(manifest.read_text())
              calls = data.get('calls', []) if isinstance(data, dict) else data
              found = next((c for c in calls if c.get('sha256') and (manifest.parent / c['original_filename']).is_file()), None)
              if found:
                  storage = upload_one(client, bucket, manifest.parent / found['original_filename'], found, manifest.parent.name)
                  print(json.dumps({'actual_audio_canary': storage}))
                  break
          else:
              raise SystemExit('No validated recording available for upload test')
          PY
      - name: Verify complete site build
        run: |
          python scripts/normalize_openmhz_metadata.py --check
          npm run build
