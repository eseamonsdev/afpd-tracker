name: Law 2 October 3 full-day transcription trial

on:
  push:
    branches: [staging]
    paths:
      - 'records-pending-review/transcription-queues/law2-2026-10-03.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: law2-transcription-trial-2026-10-03
  cancel-in-progress: false

jobs:
  wait-for-october-2:
    name: Wait for October 2 transcription to finish successfully
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runId = 40211758742;
            const deadline = Date.now() + 350 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: runId
              });
              if (run.path !== '.github/workflows/transcribe-law2-oct02-trial.yml' ||
                  run.head_branch !== 'staging') {
                throw new Error('Unexpected predecessor workflow or branch');
              }
              core.info('October 2: ' + run.status + ' / ' + run.conclusion);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('October 2 did not succeed; October 3 will not start');
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for October 2');

  independent:
    needs: wait-for-october-2
    name: Independent ${{ matrix.pass }} pass
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pass: [original, filtered]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts
            tests
            public/records/openmhz/openmhz-afpd-law-2-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/radio-transcription-requirements.txt
      - name: Install transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/radio-transcription-requirements.txt
      - name: Validate transcription guards
        run: python -m unittest discover -s tests -p 'test*radio_transcription*.py'
      - name: Transcribe every archived October 3 clip
        env:
          PASS: ${{ matrix.pass }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: >-
          python -u scripts/transcribe_law2_trial.py "$PASS"
          --date 2026-10-03
          --work-dir "$RUNNER_TEMP/law2-passes"
          --model-dir "$RUNNER_TEMP/whisper-models"
      - name: Preserve pass and recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law2-oct03-${{ matrix.pass }}-${{ github.run_id }}
          path: ${{ runner.temp }}/law2-passes/${{ matrix.pass }}.json
          if-no-files-found: warn
          retention-days: 30

  context:
    name: Context pass after both independent passes
    needs: independent
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts
            tests
            public/records/openmhz/openmhz-afpd-law-2-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/radio-transcription-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: law2-oct03-*-${{ github.run_id }}
          path: ${{ runner.temp }}/law2-passes
          merge-multiple: true
      - name: Install transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/radio-transcription-requirements.txt
      - name: Transcribe with bounded preceding-call context
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: >-
          python -u scripts/transcribe_law2_trial.py context
          --date 2026-10-03
          --work-dir "$RUNNER_TEMP/law2-passes"
          --model-dir "$RUNNER_TEMP/whisper-models"
      - name: Summarize test for AI reconciliation
        run: |
          echo '## October 3 Law 2 transcription candidates' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/law2-passes/summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'All three passes require AI reconciliation before calls.json publication. No human-validation flags were changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all passes for reconciliation or recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law2-oct03-review-${{ github.run_id }}
          path: ${{ runner.temp }}/law2-passes/*.json
          if-no-files-found: warn
          retention-days: 30
