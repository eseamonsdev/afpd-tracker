name: Copy and verify all radio audio in R2
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/migrate-radio-audio-r2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-radio-audio-migration
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.40,<2'
      - name: Copy and SHA-256 verify partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: python -u scripts/migrate_radio_audio_r2.py copy --partition "$PARTITION" --output "$RUNNER_TEMP/r2-copy"
      - name: Preserve per-file verification checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-radio-copy-${{ matrix.partition }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-copy/*
          retention-days: 90
  audit:
    needs: copy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.40,<2'
      - uses: actions/download-artifact@v4
        with:
          pattern: r2-radio-copy-*-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-copy
          merge-multiple: true
      - name: Independently list and read back every recording again
        run: python -u scripts/migrate_radio_audio_r2.py audit --reports "$RUNNER_TEMP/r2-copy" --output findings
      - name: Save audit evidence to staging without changing audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add findings/r2-radio-audio-migration-2026-10-25.json.gz findings/r2-radio-audio-migration-2026-10-25-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record complete R2 radio audio copy and independent checksum audit'
          for attempt in 1 2 3; do
            git fetch origin staging
            git rebase origin/staging
            if git push origin HEAD:staging; then exit 0; fi
          done
          exit 1
      - name: Preserve full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-radio-migration-audit-${{ github.run_id }}
          path: findings/r2-radio-audio-migration-2026-10-25*
          retention-days: 90
