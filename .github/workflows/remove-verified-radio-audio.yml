name: Remove only R2-verified radio audio from staging
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/remove-verified-radio-audio.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'boto3>=1.40,<2'
      - run: npm ci --no-audit --no-fund
      - name: Verify every target in R2 again, annotate metadata and remove only audited audio
        run: python -u scripts/remove_verified_radio_audio.py
      - name: Test storage, player and complete site build without local radio audio
        run: |
          python -m unittest discover -s tests -p 'test_openmhz*.py'
          node --test tests/police-radio.test.js tests/police-radio-excerpt.test.js tests/radio-transcripts.test.js tests/r2-radio-audio.test.js
          python scripts/normalize_openmhz_metadata.py --check
          npm run build
      - name: Commit only approved deletions and radio metadata to staging
        run: |
          python - <<'PY'
          import gzip, json, subprocess
          from pathlib import Path
          audit = json.loads(gzip.decompress(Path('findings/r2-radio-audio-migration-2026-10-25.json.gz').read_bytes()))
          allowed = {r['github_path'] for r in audit['files']}
          staged = subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=D','-z']).decode().split('\0')
          deleted = set(staged) - {''}
          unstaged = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=D','-z']).decode().split('\0')) - {''}
          if not deleted.issubset(allowed) or unstaged:
              raise SystemExit('Deletion scope check failed')
          PY
          git add -u -- public/records/openmhz
          git add findings/r2-radio-audio-removal-2026-10-25.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove only checksum-verified OpenMHz audio; retain metadata and serve R2 copies'
          for attempt in 1 2 3; do
            git fetch origin staging
            git -c rebase.autoStash=true rebase origin/staging
            if git push origin HEAD:staging; then exit 0; fi
          done
          exit 1
      - name: Preserve removal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-radio-audio-removal-${{ github.run_id }}
          path: findings/r2-radio-audio-removal-2026-10-25.json
          if-no-files-found: warn
          retention-days: 90
