name: Recover verified OpenMHz failed audio
on:
  push:
    branches: [staging, law-2]
    paths:
      - 'records-pending-review/openmhz-queues/verified-duration-recovery.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: openmhz-verified-recovery-${{ github.ref_name }}
  cancel-in-progress: false
env:
  OPENMHZ_TARGET_BRANCH: ${{ github.ref_name == 'law-2' && 'law-2' || 'staging' }}
  OPENMHZ_AUDIO_STORAGE: r2
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OPENMHZ_TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 upload client
        run: python -m pip install 'boto3>=1.40,<2'
      - name: Start public recording status heartbeat
        run: |
          nohup python3 -u scripts/publish_radio_status.py --watch > "$RUNNER_TEMP/radio-status.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radio-status.pid"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio validation tools
        timeout-minutes: 8
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends ffmpeg -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          fi
      - name: Install site dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Verify safeguards
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s tests -p 'test_openmhz*.py'
          node --test tests/police-radio.test.js
      - name: Recover browser-verified recordings sequentially
        run: python3 -u scripts/recover_verified_openmhz_audio.py
      - name: Validate and publish recovered audio to the target branch
        run: |
          python3 scripts/normalize_openmhz_metadata.py --check
          npm run build
          bash scripts/push_openmhz_import.sh
      - name: Audit all archived radio metadata for missing audio
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from r2_audio import stored_audio
          from pathlib import Path
          issues = []
          folders = 0
          expected = 0
          for folder in sorted(Path('public/records/openmhz').glob('openmhz-afpd-*')):
              metadata = folder / 'calls.json'
              if not metadata.is_file():
                  continue
              folders += 1
              data = json.loads(metadata.read_text())
              calls = data if isinstance(data, list) else data.get('calls', [])
              for call in calls:
                  name = call.get('original_filename') or call.get('filename')
                  if not name:
                      issues.append({'folder': folder.name, 'id': call.get('id'), 'issue': 'missing filename in metadata'})
                      continue
                  expected += 1
                  audio = folder / name
                  if (not audio.is_file() or audio.stat().st_size < 12) and not stored_audio(call, folder.name):
                      issues.append({'folder': folder.name, 'id': call.get('id'), 'filename': name, 'issue': 'missing or empty audio'})
          print(json.dumps({'audit_folders': folders, 'referenced_audio_entries': expected, 'missing_audio': issues}), flush=True)
          PY
      - name: Preserve recovery bundle on publication failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verified-openmhz-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/openmhz-import.bundle
          if-no-files-found: warn
      - name: Publish final recording counts
        if: always()
        continue-on-error: true
        run: |
          if test -f "$RUNNER_TEMP/radio-status.pid"; then kill "$(cat "$RUNNER_TEMP/radio-status.pid")" 2>/dev/null || true; fi
          python3 scripts/publish_radio_status.py --state '${{ job.status }}'
