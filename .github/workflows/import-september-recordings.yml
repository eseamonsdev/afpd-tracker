name: Import September recordings
on:
  push:
    branches: [import-openmhz-september-12-14-2026]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify validated import
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, base64, zlib, json, subprocess
          root=pathlib.Path('.')
          for day in [12,13,14]:
              name=f'openmhz-afpd-car-to-car-2026-09-{day}'
              archive=root/'records-pending-review'/f'{name}.zip'
              dest=root/'public/records/openmhz'/name
              dest.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      p=pathlib.PurePosixPath(info.filename)
                      assert not p.is_absolute() and '..' not in p.parts
                      z.extract(info,dest)
              archive.unlink()
          for name, data in json.loads(zlib.decompress(base64.b64decode(''))).items():
              (root/name).write_bytes(base64.b64decode(data))
          (root/'.github/workflows/import-september-recordings.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='f42494e16b62cf239aa2b9f6b172bf341e36a3e6', tree
          print('Verified exact tree: '+tree)
          PY
      - name: Commit extracted recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import OpenMHz recordings for September 12–14, 2026'
          git push origin HEAD:import-openmhz-september-12-14-2026
