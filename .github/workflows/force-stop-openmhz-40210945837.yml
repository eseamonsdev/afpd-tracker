name: Finish stopping requested Law 2 download
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/force-stop-openmhz-40210945837.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel only the already-cancelled requested run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/eseamonsdev/afpd-tracker/actions/runs/40210945837/force-cancel
