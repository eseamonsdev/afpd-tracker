name: Import OpenMHz ZIPs

on:
  push:
    branches: [staging, main, setup-openmhz-zip-import]
    paths:
      - 'records-pending-review/openmhz-afpd-car-to-car-*.zip'
      - 'records-pending-review/openmhz-afpd-law-2-*.zip'
      - '.github/workflows/import-openmhz-zips.yml'
      - 'scripts/import_openmhz_zips.py'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Always consume the latest staging uploads. The setup branch bootstraps
          # this permanent workflow and is included in its first import PR.
          ref: ${{ github.ref_name == 'setup-openmhz-zip-import' && 'setup-openmhz-zip-import' || 'staging' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate and extract pending ZIPs
        id: import
        run: |
          python3 -m unittest discover -s tests -p 'test_openmhz_import.py'
          python3 scripts/import_openmhz_zips.py --summary "$RUNNER_TEMP/openmhz-summary.json"
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard public/records/openmhz)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify archive and build site
        if: steps.import.outputs.changed == 'true'
        run: |
          npm ci
          node --test tests/police-radio.test.js
          npm run build
      - name: Commit imported recordings and rebuilt HTML to staging
        if: steps.import.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public records-pending-review
          git commit -m 'Import pending OpenMHz day ZIPs and rebuild site HTML'
          # Do not force-push: preserve any staging updates made during the build.
          git push origin HEAD:staging
          echo 'Imported recordings and rebuilt HTML committed directly to staging.' >> "$GITHUB_STEP_SUMMARY"
