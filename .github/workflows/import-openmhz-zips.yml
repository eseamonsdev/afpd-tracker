name: Import OpenMHz ZIPs

on:
  push:
    branches: [staging, main, setup-openmhz-zip-import]
    paths:
      - 'records-pending-review/openmhz-afpd-car-to-car-*.zip'
      - 'records-pending-review/openmhz-afpd-law-2-*.zip'
      - '.github/workflows/import-openmhz-zips.yml'
      - 'scripts/import_openmhz_zips.py'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false

env:
  OPENMHZ_AUDIO_STORAGE: r2
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Always consume the latest staging uploads. The setup branch bootstraps
          # this permanent workflow and is included in its first import PR.
          ref: ${{ github.ref_name == 'setup-openmhz-zip-import' && 'setup-openmhz-zip-import' || 'staging' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 upload client
        run: python -m pip install 'boto3>=1.40,<2'
      - name: Start public recording status heartbeat
        run: |
          nohup python3 -u scripts/publish_radio_status.py --watch > "$RUNNER_TEMP/radio-status.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radio-status.pid"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure audio validation tool is available
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Validate and extract pending ZIPs
        id: import
        run: |
          python3 -m unittest discover -s tests -p 'test_openmhz_import.py'
          python3 scripts/import_openmhz_zips.py --summary "$RUNNER_TEMP/openmhz-summary.json"
          # Preserve the ZIP entry point while keeping its output in the current format.
          python3 scripts/normalize_openmhz_metadata.py
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard public/records/openmhz)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify archive and build site
        if: steps.import.outputs.changed == 'true'
        run: |
          npm ci
          node --test tests/police-radio.test.js
          npm run build
      - name: Commit imported recordings and rebuilt HTML to staging
        if: steps.import.outputs.changed == 'true'
        run: |
          bash scripts/push_openmhz_import.sh
          echo 'Audio verified in R2; metadata and rebuilt HTML saved to staging.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish final recording counts
        if: always()
        continue-on-error: true
        run: |
          if test -f "$RUNNER_TEMP/radio-status.pid"; then kill "$(cat "$RUNNER_TEMP/radio-status.pid")" 2>/dev/null || true; fi
          python3 scripts/publish_radio_status.py --state '${{ job.status }}'
