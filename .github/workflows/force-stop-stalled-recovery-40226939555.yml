name: Release stalled recovery runner
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/force-stop-stalled-recovery-40226939555.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel only the stalled recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/eseamonsdev/afpd-tracker/actions/runs/40226939555/force-cancel
