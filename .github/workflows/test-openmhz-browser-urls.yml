name: Test OpenMHz browser URL collection

on:
  workflow_dispatch:
  push:
    branches: [staging, test-openmhz-browser-urls]
    paths:
      - '.github/workflows/test-openmhz-browser-urls.yml'
      - 'scripts/openmhz-browser-test/**'

permissions:
  contents: read

concurrency:
  group: openmhz-browser-url-test
  cancel-in-progress: false

jobs:
  collect-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/openmhz-browser-test/
            /public/records/openmhz/openmhz-afpd-car-to-car-2026-09-30/calls.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: scripts/openmhz-browser-test
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/openmhz-browser-test
        run: npx playwright install --with-deps chromium
      - name: Collect September 30 URLs through the normal website
        working-directory: scripts/openmhz-browser-test
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openmhz-browser-results
        run: npm run collect
      - name: Save URL list and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmhz-browser-urls-2026-09-30
          path: ${{ runner.temp }}/openmhz-browser-results/
          if-no-files-found: warn
          retention-days: 14
