name: Law 2 sequential downloads October 13–15
on:
  push:
    branches: [staging]
    paths:
      - 'records-pending-review/openmhz-queues/law2-2026-10-13-through-15.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: law2-sequential-2026-10-13-through-15
  cancel-in-progress: false
jobs:
  october_13:
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: '2026-10-13'
  october_14:
    needs: october_13
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: '2026-10-14'
  october_15:
    needs: october_14
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: '2026-10-15'
