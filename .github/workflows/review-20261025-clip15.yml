name: Review October 25 clip 15 with larger models
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/review-20261025-clip15.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/requirements-radio.txt 'boto3>=1.40,<2'
      - name: Compare larger models without wording prompts
        run: |
          python -u - <<'PY'
          import sys, os, json, subprocess, tempfile, gc
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from r2_audio import client_and_bucket, read_verified
          from faster_whisper import WhisperModel
          folder = Path('public/records/openmhz/openmhz-afpd-car-to-car-2026-10-25')
          call = json.loads((folder / 'calls.json').read_text())['calls'][14]
          assert call['epoch'] == 1792908254
          client, bucket = client_and_bucket()
          cfg = json.loads(Path('scripts/radio-transcription-settings.json').read_text())
          output = Path('transcription-work/6001/2026-10-25/clip-015-larger-models.json')
          result = {'date':'2026-10-25', 'clip':15, 'filename':call['original_filename'], 'sha256':call['sha256'], 'human_verified':False, 'initial_prompt':None, 'results':[]}
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          with tempfile.TemporaryDirectory(prefix='clip15-audio-',dir=os.environ['RUNNER_TEMP']) as tmp:
              original = Path(tmp) / call['original_filename']
              original.write_bytes(read_verified(client,bucket,call['audio_storage']['key'],call['sha256'],call['size_bytes']))
              filtered = Path(tmp) / 'filtered.wav'
              subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(original),'-af',cfg['filter'],'-ar','16000','-ac','1',str(filtered)],check=True)
              for name in ['medium.en','large-v3']:
                  print('Loading', name, flush=True)
                  model = WhisperModel(name,device='cpu',compute_type='int8',cpu_threads=4,download_root=os.environ['RUNNER_TEMP']+'/clip15-models')
                  for kind, audio in [('original',original),('filtered',filtered)]:
                      print('START',name,kind,flush=True)
                      segments, info = model.transcribe(str(audio),language='en',beam_size=5,temperature=0,condition_on_previous_text=False,vad_filter=False,initial_prompt=None)
                      segments = list(segments)
                      row = {'model':name,'audio':kind,'text':' '.join(s.text.strip() for s in segments),'segments':[{'start':s.start,'end':s.end,'text':s.text,'avg_logprob':s.avg_logprob,'no_speech_prob':s.no_speech_prob} for s in segments]}
                      result['results'].append(row)
                      print(json.dumps(row),flush=True)
                  del model
                  gc.collect()
                  output.write_text(json.dumps(result,indent=2)+'\n')
                  subprocess.run(['git','add','--',str(output)],check=True)
                  subprocess.run(['git','commit','-m','Review Oct 25 clip 15 using '+name,'--',str(output)],check=True)
                  subprocess.run(['git','fetch','origin','staging'],check=True)
                  subprocess.run(['git','rebase','origin/staging'],check=True)
                  subprocess.run(['git','push','origin','HEAD:staging'],check=True)
          print('DONE: temporary audio deleted; transcript unchanged.',flush=True)
          PY
