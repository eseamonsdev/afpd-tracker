name: Transcribe 6001 in resumable batches
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/transcribe-6001-batches.yml'
      - 'records-pending-review/openmhz-transcription-request.json'
  workflow_dispatch:
    inputs:
      day:
        description: America/Denver calendar date
        required: true
        default: '2026-10-25'
permissions:
  contents: write
concurrency:
  group: transcribe-6001-staging
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      REQUESTED_DAY: ${{ inputs.day }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve requested Mountain date
        id: request
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          day = os.environ.get('REQUESTED_DAY') or json.loads(Path('records-pending-review/openmhz-transcription-request.json').read_text())['date']
          assert datetime.date.fromisoformat(day).isoformat() == day
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('day=' + day + '\n')
          print('Target:', day, 'talkgroup 6001; staging only')
          PY
      - name: Install pinned transcription engine and R2 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/requirements-radio.txt 'boto3>=1.40,<2'
          command -v ffmpeg
          command -v ffprobe
      - name: Cache model weights only
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/6001-models
          key: 6001-whisper-${{ runner.os }}-${{ hashFiles('scripts/radio-transcription-settings.json') }}
      - name: Transcribe R2 recordings and commit text every ten clips
        env:
          TARGET_DAY: ${{ steps.request.outputs.day }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -u scripts/transcribe_6001_batches.py --date "$TARGET_DAY" --batch-size 10 --audio-dir "$RUNNER_TEMP/6001-audio-current" --model-dir "$RUNNER_TEMP/6001-models"
      - name: Delete local audio even after failure
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          audio = Path(os.environ['RUNNER_TEMP']) / '6001-audio-current'
          shutil.rmtree(audio, ignore_errors=True)
          print('Local original/filtered audio removed. R2 originals unchanged.')
          PY
      - name: Report saved progress
        if: always()
        env:
          TARGET_DAY: ${{ steps.request.outputs.day }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          day = os.environ.get('TARGET_DAY', '')
          path = Path('transcription-work/6001') / day / 'status.json'
          message = 'No checkpoint yet; inspect the failed step.'
          if day and path.exists():
              d = json.loads(path.read_text())
              message = f"{day}: {d['three_pass_clips']}/{d['total_clips']} clips saved with three passes. State: {d['state']}. Reconciliation is a separate automated step."
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(message + '\n')
          PY
