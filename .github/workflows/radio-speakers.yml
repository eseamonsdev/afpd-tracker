name: Embed radio voice clips
'on':
  workflow_dispatch:
    inputs:
      days:
        description: 'Dates separated by commas (YYYY-MM-DD), or all'
        required: true
        type: string
      min_speech:
        description: Minimum detected speech in seconds
        default: '2'
        type: string
  push:
    branches: [staging]
    paths:
      - records-pending-review/radio-speaker-request.json
      - .github/workflows/radio-speakers.yml
      - scripts/reorganize_voice_storage.py
      - tests/test_embedding_only.py
      - tests/test_incremental_radio_speakers.py
      - tests/test_voice_storage.py
      - scripts/group_radio_voices.py
      - scripts/requirements-radio-speakers.txt
      - tests/test_radio_speakers.py
permissions:
  contents: read
concurrency:
  group: radio-speaker-processing-staging
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      min_speech: ${{ steps.plan.outputs.min_speech }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      model_revision: ${{ steps.plan.outputs.model_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Test embedding extraction and separate comparison
        run: |
          python -m unittest discover -s tests -p test_radio_speakers.py
          python -m unittest discover -s tests -p test_voice_storage.py
          python -m unittest discover -s tests -p test_incremental_radio_speakers.py
          python -m unittest discover -s tests -p test_embedding_only.py
      - name: Resolve selected 6001 dates
        id: plan
        env:
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_MIN_SPEECH: ${{ inputs.min_speech }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from group_radio_voices import select_days, positive
          from radio_config import valid_day
          root = Path.cwd()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          request_path = 'records-pending-review/radio-speaker-request.json'
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              # Checkout the event SHA to avoid reading a later request from staging.
              subprocess.run(['git', 'checkout', '--detach', event['after']], check=True)
              sha = event['after']
              before = event.get('before', '')
              command = (['git', 'diff', '--name-only', before, sha] if before and set(before) != {'0'}
                         else ['git', 'show', '--pretty=format:', '--name-only', sha])
              changed = subprocess.check_output(command, text=True).splitlines()
              if request_path not in changed or not Path(request_path).is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('has_work=false\n')
                  sys.exit(0)
              request = json.loads(Path(request_path).read_text())
          else:
              request = {'days': os.environ['INPUT_DAYS'],
                         'min_speech': os.environ['INPUT_MIN_SPEECH'] or '2'}
          minimum = positive(request.get('min_speech', 2))
          revision = request.get('model_revision', '')
          if 'jobs' in request:
              import re
              if not re.fullmatch(r'[0-9a-f]{40}', revision):
                  raise ValueError('Backfill requires an exact model revision')
              jobs = request['jobs']
              keys = set()
              for job in jobs:
                  if job['talkgroup'] not in (6001, 5922) or not re.fullmatch(r'[1-9]\d*(?:,[1-9]\d*)*', job['clips']):
                      raise ValueError('Invalid backfill selection')
                  key = job['talkgroup'], valid_day(job['day'])
                  if key in keys:
                      raise ValueError('Duplicate backfill job')
                  keys.add(key)
          else:
              selection = request['days']
              if isinstance(selection, list):
                  selection = ','.join(selection)
              jobs = [{'day': day, 'talkgroup': 6001, 'clips': ''}
                      for day in select_days(root, selection)]
          if len(jobs) > 256:
              raise ValueError('At most 256 jobs per run; split the selection')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': jobs or [{}]}) + '\n')
              f.write(f'has_work={str(bool(jobs)).lower()}\nmin_speech={minimum}\nsource_sha={sha}\nmodel_revision={revision}\n')
          PY
  embed:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.talkgroup }} / ${{ matrix.day }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: radio-speakers-${{ matrix.talkgroup }}-${{ matrix.day }}
      cancel-in-progress: false
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      DAY: ${{ matrix.day }}
      TALKGROUP: ${{ matrix.talkgroup }}
      EVIDENCE_CLIPS: ${{ matrix.clips }}
      MODEL_REVISION: ${{ needs.plan.outputs.model_revision }}
      MIN_SPEECH: ${{ needs.plan.outputs.min_speech }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU speaker model dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-radio-speakers.txt
          python -m pip check
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/radio-speaker-models
          key: radio-speakers-${{ runner.os }}-${{ hashFiles('scripts/requirements-radio-speakers.txt') }}
      - name: Embed voices and save original clip numbers
        run: |
          options=()
          if [[ -n "$EVIDENCE_CLIPS" ]]; then
            options+=(--evidence-clips "$EVIDENCE_CLIPS" --model-revision "$MODEL_REVISION")
          fi
          python -u scripts/group_radio_voices.py run --day "$DAY" --talkgroup "$TALKGROUP" --min-speech "$MIN_SPEECH" --model-dir "$RUNNER_TEMP/radio-speaker-models" --output "voice-recognition/$TALKGROUP" --publish "${options[@]}"
      - name: Upload reports and embeddings (including partial results)
        if: always() && matrix.clips == ''
        uses: actions/upload-artifact@v4
        with:
          name: radio-embeddings-${{ matrix.talkgroup }}-${{ matrix.day }}
          path: voice-recognition/${{ matrix.talkgroup }}/${{ matrix.day }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Show daily embedding summary
        if: always()
        run: |
          if [ -f "voice-recognition/$TALKGROUP/$DAY/report.md" ]; then
            cat "voice-recognition/$TALKGROUP/$DAY/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
