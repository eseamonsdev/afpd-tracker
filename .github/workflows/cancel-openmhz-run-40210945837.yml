name: Stop requested October 14 Law 2 download
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/cancel-openmhz-run-40210945837.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the requested sequential download run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/eseamonsdev/afpd-tracker/actions/runs/40210945837/cancel
