name: Release stalled October 25 setup
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/release-stalled-openmhz-setup.yml']
permissions:
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = 40342509139;
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (run.status !== 'completed') {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...context.repo, run_id});
              core.notice('Released stalled setup run ' + run_id);
            }
