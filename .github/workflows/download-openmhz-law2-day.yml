name: Download one Law 2 day

on:
  push:
    branches: [law-2]
    paths: ['records-pending-review/openmhz-queues/law2-day-request.json']
  workflow_dispatch:
    inputs:
      day:
        description: 'Law 2 date to download (YYYY-MM-DD); preserved metadata must exist'
        required: true
        type: string
  workflow_call:
    inputs:
      day:
        required: true
        type: string

permissions:
  contents: write

env:
  OPENMHZ_TARGET_BRANCH: law-2
  OPENMHZ_AUDIO_STORAGE: r2
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: openmhz-zip-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: law-2
          fetch-depth: 0
      - name: Resolve and validate requested date
        id: requested
        env:
          REQUESTED_DAY: ${{ inputs.day }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          day = os.environ.get('REQUESTED_DAY', '').strip()
          if not day:
              if os.environ['RUN_EVENT'] != 'push':
                  raise ValueError('A day input is required')
              day = json.loads(Path('records-pending-review/openmhz-queues/law2-day-request.json').read_text())['day']
          if date.fromisoformat(day).isoformat() != day:
              raise ValueError('Day must use YYYY-MM-DD format')
          source = Path('records-pending-review/openmhz-metadata/law-2') / day / 'calls.json'
          if not source.is_file():
              raise ValueError(f'No preserved Law 2 metadata for {day}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('day=' + day + '\n')
          print('Requested Law 2 audio date:', day, flush=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 upload client
        run: python -m pip install 'boto3>=1.40,<2'
      - name: Start public recording status heartbeat
        run: |
          nohup python3 -u scripts/publish_radio_status.py --watch > "$RUNNER_TEMP/radio-status.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radio-status.pid"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify downloader and prepare tools
        timeout-minutes: 4
        run: |
          python3 -m unittest discover -s tests -p 'test_openmhz*.py'
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          npm ci --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
          node --test tests/police-radio.test.js
      - name: Prepare this day's remaining calls
        env:
          DAY: ${{ steps.requested.outputs.day }}
        run: python3 scripts/prepare_law2_day.py --date "$DAY"
      - name: Download this day sequentially and save every 100 calls
        env:
          DAY: ${{ steps.requested.outputs.day }}
        run: |
          set -euo pipefail
          manifest="$DAY-law-2.json"
          while test -f "records-pending-review/openmhz-manifests/$manifest"; do
            python3 -u scripts/download_openmhz_manifest.py --manifest "$manifest" --batch-size 100 --summary "$RUNNER_TEMP/openmhz-download-summary.json"
            cat "$RUNNER_TEMP/openmhz-download-summary.json" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/normalize_openmhz_metadata.py --check
            npm run build
            bash scripts/push_openmhz_import.sh
          done
          echo "$DAY finished; any failed clips are recorded separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve checkpoint recovery bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: law2-${{ steps.requested.outputs.day }}-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/openmhz-import.bundle
          if-no-files-found: warn
          retention-days: 7
      - name: Publish final recording counts
        if: always()
        continue-on-error: true
        run: |
          if test -f "$RUNNER_TEMP/radio-status.pid"; then kill "$(cat "$RUNNER_TEMP/radio-status.pid")" 2>/dev/null || true; fi
          python3 scripts/publish_radio_status.py --state '${{ job.status }}'
