name: Stop requested OpenMHz run
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/cancel-openmhz-run-40116787131.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the specific requested download run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/eseamonsdev/afpd-tracker/actions/runs/40116787131/cancel
