              run = request('/actions/runs/' + str(target['id']))
              if run.get('missing'):
                  continue
              if run['path'] != target['path'] or run['status'] != 'completed':
                  raise RuntimeError('Run identity or completion state changed')
              request('/actions/runs/' + str(target['id']), 'DELETE')
              deleted += 1
              print('Deleted', target['id'], target['path'], flush=True)
