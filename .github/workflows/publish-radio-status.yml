name: Publish radio recording counts
'on':
  push:
    branches:
    - staging
    - law-2
    paths:
    - scripts/publish_radio_status.py
    - public/police-radio-status.html
    - .github/workflows/publish-radio-status.yml
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch for metadata and text checkpoints
        required: false
        default: staging
        type: choice
        options:
        - staging
        - law-2
permissions:
  contents: read
concurrency:
  group: radio-status-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENMHZ_TARGET_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.target_branch || 'staging' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'push' && github.ref_name || inputs.target_branch || 'staging' }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install R2 client
      run: python -m pip install 'boto3>=1.40,<2'
    - name: Publish counts for all saved talkgroups
      run: python3 scripts/publish_radio_status.py --state idle
