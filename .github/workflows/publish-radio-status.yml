name: Publish radio recording counts
on:
  push:
    branches: [staging, main]
    paths:
      - scripts/publish_radio_status.py
      - public/police-radio-status.html
      - .github/workflows/publish-radio-status.yml
      - public/records/openmhz/**/calls.json
      - records-pending-review/openmhz-metadata/**/calls.json
      - records-pending-review/openmhz-failures/*.json
      - records-pending-review/openmhz-audio-request.json
  workflow_run:
    workflows: [Download radio audio]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-radio-status
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [staging, main]
    steps:
      # Use the maintained publisher while reading each branch independently.
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: .radio-status-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install 'boto3>=1.40,<2'
      - name: Publish branch inventory and recording counts
        env:
          STATUS_BRANCH: ${{ matrix.branch }}
        run: |
          page_args=()
          if [ "$STATUS_BRANCH" = staging ]; then page_args+=(--publish-page); fi
          python3 scripts/publish_radio_status.py --root .radio-status-source --branch "$STATUS_BRANCH" --state idle "${page_args[@]}"
