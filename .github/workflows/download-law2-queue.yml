name: Download queued Law 2 dates
on:
  push:
    branches: [staging]
    paths: ['records-pending-review/openmhz-queues/law2-download-queue.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: law2-download-queue
  cancel-in-progress: false
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      first: ${{ steps.queue.outputs.first }}
      second: ${{ steps.queue.outputs.second }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Validate queued dates
        id: queue
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path
          q = json.loads(Path('records-pending-review/openmhz-queues/law2-download-queue.json').read_text())
          days = q['days']
          assert len(days) == 2 and all(date.fromisoformat(d).isoformat() == d for d in days)
          assert date.fromisoformat(days[1]) == date.fromisoformat(days[0]) + timedelta(days=1)
          assert isinstance(q['after_run_id'], int) and q['after_run_id'] > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('first=' + days[0] + '\nsecond=' + days[1] + '\npredecessor=' + str(q['after_run_id']) + '\n')
          PY
      - name: Wait for the preceding download batch
        uses: actions/github-script@v7
        env:
          PREDECESSOR: ${{ steps.queue.outputs.predecessor }}
        with:
          script: |
            const runId = Number(process.env.PREDECESSOR);
            const deadline = Date.now() + 350 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
              core.info('Preceding download batch: ' + run.status + ' / ' + run.conclusion);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Preceding batch did not succeed; queue not started');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Preceding batch still running; queue preserved for a later run');
  metadata:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openmhz-zip-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve each queued day's source metadata
        env:
          FIRST: ${{ needs.wait.outputs.first }}
          SECOND: ${{ needs.wait.outputs.second }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for day in "$FIRST" "$SECOND"; do
            python -u scripts/collect_law2_metadata.py --date "$day"
            git add "records-pending-review/openmhz-metadata/law-2/$day"
            if ! git diff --cached --quiet; then
              git commit -m "Preserve source Law 2 metadata for $day"
              published=false
              for attempt in 1 2 3; do
                git fetch origin staging
                git rebase origin/staging
                if git push origin HEAD:staging; then published=true; break; fi
              done
              if [ "$published" != true ]; then exit 1; fi
            fi
          done
  first_date:
    needs: [wait, metadata]
    secrets: inherit
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: ${{ needs.wait.outputs.first }}
  second_date:
    needs: [wait, first_date]
    secrets: inherit
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: ${{ needs.wait.outputs.second }}
