name: Download queued Law 2 dates
on:
  push:
    branches: [law-2]
    paths: ['records-pending-review/openmhz-queues/law2-download-queue.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: law2-download-queue
  cancel-in-progress: false
env:
  OPENMHZ_TARGET_BRANCH: law-2
  OPENMHZ_AUDIO_STORAGE: r2
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      first: ${{ steps.queue.outputs.first }}
      second: ${{ steps.queue.outputs.second }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: law-2
      - name: Validate queued dates
        id: queue
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          q = json.loads(Path('records-pending-review/openmhz-queues/law2-download-queue.json').read_text())
          days = q['days']
          assert 1 <= len(days) <= 2 and all(date.fromisoformat(d).isoformat() == d for d in days)
          assert len(set(days)) == len(days)
          assert isinstance(q['after_run_id'], int) and q['after_run_id'] > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('first=' + days[0] + '\nsecond=' + (days[1] if len(days) > 1 else '') + '\npredecessor=' + str(q['after_run_id']) + '\n')
          PY
      - name: Wait for the preceding download batch
        uses: actions/github-script@v7
        env:
          PREDECESSOR: ${{ steps.queue.outputs.predecessor }}
        with:
          script: |
            const runId = Number(process.env.PREDECESSOR);
            const deadline = Date.now() + 350 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
              core.info('Preceding download batch: ' + run.status + ' / ' + run.conclusion);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Preceding batch did not succeed; queue not started');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Preceding batch still running; queue preserved for a later run');
  first_date:
    needs: wait
    secrets: inherit
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: ${{ needs.wait.outputs.first }}
  second_date:
    if: ${{ always() && needs.wait.result == 'success' && needs.wait.outputs.second != '' && (needs.first_date.result == 'success' || needs.first_date.result == 'failure') }}
    needs: [wait, first_date]
    secrets: inherit
    uses: ./.github/workflows/download-openmhz-law2-day.yml
    with:
      day: ${{ needs.wait.outputs.second }}
