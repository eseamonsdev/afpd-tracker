name: Download OpenMHz manifests

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'records-pending-review/openmhz-manifests/*.json'

permissions:
  contents: write

concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false

env:
  OPENMHZ_AUDIO_STORAGE: r2
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 upload client
        run: python -m pip install 'boto3>=1.40,<2'
      - name: Start public recording status heartbeat
        run: |
          nohup python3 -u scripts/publish_radio_status.py --watch > "$RUNNER_TEMP/radio-status.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radio-status.pid"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify downloader safeguards
        run: python3 -m unittest discover -s tests -p 'test_openmhz*.py'
      - name: Prepare validation and build tools
        timeout-minutes: 4
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          npm ci --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
          node --test tests/police-radio.test.js
      - name: Download once per clip and checkpoint every 100 calls
        run: |
          set -euo pipefail
          batch=0
          while compgen -G 'records-pending-review/openmhz-manifests/*.json' > /dev/null; do
            batch=$((batch + 1))
            echo "Starting checkpoint batch $batch (up to 100 calls)"
            python3 -u scripts/download_openmhz_manifest.py --batch-size 100 --summary "$RUNNER_TEMP/openmhz-download-summary.json"
            cat "$RUNNER_TEMP/openmhz-download-summary.json" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/normalize_openmhz_metadata.py --check
            npm run build
            bash scripts/push_openmhz_import.sh
            echo "Checkpoint batch $batch saved to staging"
          done
      - name: Preserve checkpoint recovery bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openmhz-import-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/openmhz-import.bundle
          if-no-files-found: warn
          retention-days: 7
      - name: Publish final recording counts
        if: always()
        continue-on-error: true
        run: |
          if test -f "$RUNNER_TEMP/radio-status.pid"; then kill "$(cat "$RUNNER_TEMP/radio-status.pid")" 2>/dev/null || true; fi
          python3 scripts/publish_radio_status.py --state '${{ job.status }}'
