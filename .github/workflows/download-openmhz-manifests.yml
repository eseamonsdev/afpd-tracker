name: Download OpenMHz manifests

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'records-pending-review/openmhz-manifests/*.json'
      - 'scripts/download_openmhz_manifest.py'
      - 'scripts/normalize_openmhz_metadata.py'
      - 'scripts/push_openmhz_import.sh'
      - 'tests/test_openmhz_download.py'
      - 'tests/test_openmhz_metadata.py'
      - 'tests/test_openmhz_push.py'
      - '.github/workflows/download-openmhz-manifests.yml'

permissions:
  contents: write

# Share the archive writer lock with the existing importer.
concurrency:
  group: openmhz-zip-import
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify downloader safeguards
        run: python3 -m unittest discover -s tests -p 'test_openmhz*.py'
      - name: Ensure audio validation tool is available
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download and validate pending manifests
        id: download
        run: |
          python3 scripts/download_openmhz_manifest.py --summary "$RUNNER_TEMP/openmhz-download-summary.json"
          python3 scripts/normalize_openmhz_metadata.py --check
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard public/records/openmhz)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/openmhz-download-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify archive
        if: steps.download.outputs.changed == 'true'
        run: |
          npm ci
          node --test tests/police-radio.test.js
          npm run build
      - name: Commit direct downloads to staging
        if: steps.download.outputs.changed == 'true'
        run: bash scripts/push_openmhz_import.sh
      - name: Preserve downloaded audio if the push fails
        if: failure() && steps.download.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmhz-import-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/openmhz-import.bundle
          if-no-files-found: warn
          retention-days: 7
