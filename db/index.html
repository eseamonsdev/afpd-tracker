<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database viewer</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f6fa; color: #172840; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { max-width: 1500px; margin: 0 auto; padding: 2rem clamp(1rem, 3vw, 3rem); }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.5rem, 3vw, 2.2rem); }
    p { color: #526278; line-height: 1.5; }
    .controls { display: flex; flex-wrap: wrap; gap: .8rem; align-items: end; margin: 1.5rem 0; }
    label { display: grid; gap: .35rem; font-weight: 600; }
    input, select, button { font: inherit; min-height: 2.6rem; border-radius: .45rem; border: 1px solid #b7c4d4; padding: .5rem .7rem; background: white; color: inherit; }
    input { width: min(24rem, 85vw); }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #e5eef9; }
    button:disabled { opacity: .55; cursor: default; }
    .summary { min-height: 1.8rem; margin: .4rem 0 .8rem; }
    .table-wrap { overflow: auto; border: 1px solid #d4dce7; border-radius: .6rem; background: white; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: .91rem; }
    th, td { padding: .72rem .85rem; text-align: left; border-bottom: 1px solid #e6ebf1; }
    th { position: sticky; top: 0; background: #e9f0f9; color: #233d61; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr.primary { background: #ebf5ee; }
    td.empty { color: #8995a5; }
    td button { min-height: 2rem; padding: .15rem .5rem; color: #23578c; text-decoration: underline; border: 0; background: transparent; }
    .pages { display: flex; gap: .7rem; align-items: center; margin: 1rem 0; }
    .error { color: #a12424; }
    .badge { display: inline-block; background: #e0ecdf; padding: .14rem .48rem; border-radius: 1rem; font-size: .78rem; }
  </style>
</head>
<body>
  <main>
    <h1>Database viewer</h1>
    <p>Read-only snapshot of the officer and radio tables. This page cannot modify the database or the public website.</p>
    <div class="controls">
      <label>Table <select id="table"><option value="officers">officers</option><option value="officer_names">officer_names</option><option value="radio_talkgroups">radio_talkgroups</option><option value="radio_ids">radio_ids</option><option value="radio_clips">radio_clips</option><option value="radio_clip_sources">radio_clip_sources</option></select></label>
      <label id="month-control" hidden>Archive month <select id="month"></select></label>
      <label id="talkgroup-control" hidden>Talkgroup <select id="talkgroup"><option value="">All talkgroups</option></select></label>
      <label>Search <input id="search" type="search" placeholder="Name, slug, or ID" autocomplete="off"></label>
      <button id="clear-filter" type="button" hidden>Show all names</button>
    </div>
    <p class="summary" id="summary" role="status" aria-live="polite">Loading…</p>
    <div class="table-wrap"><table id="rows"><thead></thead><tbody></tbody></table></div>
    <div class="pages"><button id="previous" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></div>
  </main>
  <script>
    const state = { table: 'officers', search: '', offset: 0, limit: 25, officerId: null, month: '', talkgroup: '' };
    const tableSelect = document.getElementById('table');
    const monthSelect = document.getElementById('month');
    const talkgroupSelect = document.getElementById('talkgroup');
    const radioTables = new Set(['radio_clips', 'radio_clip_sources']);
    const searchInput = document.getElementById('search');
    const summary = document.getElementById('summary');
    const clearFilter = document.getElementById('clear-filter');
    const head = document.querySelector('#rows thead');
    const body = document.querySelector('#rows tbody');
    const page = document.getElementById('page');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    let request = 0;
    // On staging, the snapshot is bundled with the page. The local viewer uses
    // the read-only SQLite API when there is no snapshot file.
    const snapshotPromise = fetch('/db/snapshot.json', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : null).catch(() => null);
    const chunkCache = new Map();

    async function initializePeriods() {
      const snapshot = await snapshotPromise;
      const periods = snapshot ? snapshot._radio_chunks :
        (await (await fetch('/db/api/radio-periods')).json()).periods;
      const months = [...new Set(periods.map(period => period.month))];
      for (const month of months) monthSelect.add(new Option(month, month));
      for (const group of [...new Set(periods.map(period => period.talkgroup))].sort((a, b) => a - b)) {
        talkgroupSelect.add(new Option(String(group), String(group)));
      }
      state.month = months[0] || '';
    }

    async function radioRows(snapshot) {
      const chunks = snapshot._radio_chunks.filter(item => item.month === state.month &&
        (!state.talkgroup || String(item.talkgroup) === state.talkgroup));
      const parts = await Promise.all(chunks.map(async item => {
        if (!chunkCache.has(item.file)) {
          chunkCache.set(item.file, fetch(`/db/${item.file}`).then(async response => {
            if (!response.ok) throw new Error(`Could not load ${item.file}`);
            const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
            return JSON.parse(await new Response(stream).text());
          }));
        }
        return chunkCache.get(item.file);
      }));
      const columns = parts[0]?.[state.table].columns ||
        (state.table === 'radio_clips' ? ['id', 'system', 'talkgroup_number', 'archive_date', 'clip_number',
          'timestamp_utc', 'original_filename', 'displayed_seconds', 'audio_duration_seconds',
          'frequency_hz', 'emergency', 'transcript',
          'original_transcript', 'transcript_validated', 'needs_review', 'audio_provider',
          'audio_bucket', 'audio_key', 'audio_sha256', 'audio_size_bytes', 'audio_verified',
          'audio_downloaded', 'source_duration_matches', 'archive_path'] :
          ['clip_id', 'radio_id', 'source_position', 'archive_date', 'talkgroup_number', 'clip_number']);
      const unpack = table => table.rows.map(values => Object.fromEntries(
        table.columns.map((column, index) => [column, values[index]])));
      const rows = parts.flatMap(part => unpack(part[state.table]));
      const sources = new Map();
      if (state.table === 'radio_clips') for (const part of parts) {
        for (const source of unpack(part.radio_clip_sources)) {
          if (!sources.has(source.clip_id)) sources.set(source.clip_id, []);
          sources.get(source.clip_id).push(source.radio_id);
        }
      }
      return { columns, rows, sources };
    }

    async function getRows() {
      const snapshot = await snapshotPromise;
      if (!snapshot) {
        const params = new URLSearchParams({ q: state.search, offset: state.offset, limit: state.limit });
        if (state.officerId !== null) params.set('officer_id', state.officerId);
        if (radioTables.has(state.table)) {
          if (state.month) params.set('month', state.month);
          if (state.talkgroup) params.set('talkgroup', state.talkgroup);
        }
        const response = await fetch(`/db/api/table/${state.table}?${params}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load table');
        return result;
      }
      const radio = radioTables.has(state.table) ? await radioRows(snapshot) : null;
      const table = radio || snapshot[state.table];
      if (!table) throw new Error('Unknown table');
      const query = state.search.trim().toLocaleLowerCase();
      const officers = new Map(snapshot.officers.rows.map(officer => [officer.id, officer]));
      const names = new Map();
      for (const name of snapshot.officer_names.rows) {
        if (!names.has(name.officer_id)) names.set(name.officer_id, []);
        names.get(name.officer_id).push(name.name_text.toLocaleLowerCase());
      }
      const rows = table.rows.filter(row => {
        if (state.officerId !== null && row.officer_id !== state.officerId) return false;
        if (!query) return true;
        if (state.table === 'officers') {
          return String(row.id) === query || row.url_slug.toLocaleLowerCase().includes(query) ||
            row.legacy_entity_id.toLocaleLowerCase().includes(query) ||
            (names.get(row.id) || []).some(name => name.includes(query));
        }
        if (state.table === 'officer_names') return String(row.id) === query ||
          row.name_text.toLocaleLowerCase().includes(query) ||
          officers.get(row.officer_id)?.url_slug.toLocaleLowerCase().includes(query);
        if (state.table === 'radio_talkgroups') return String(row.number).includes(query) ||
          row.name.toLocaleLowerCase().includes(query) || row.system.toLocaleLowerCase().includes(query);
        if (state.table === 'radio_ids') return row.id.includes(query);
        if (state.table === 'radio_clips') return row.id.includes(query) ||
          row.archive_date.includes(query) ||
          String(row.clip_number) === query || (row.transcript || '').toLocaleLowerCase().includes(query) ||
          (row.original_transcript || '').toLocaleLowerCase().includes(query) ||
          (radio.sources.get(row.id) || []).some(id => id.includes(query));
        return row.radio_id.includes(query) || row.clip_id.includes(query) ||
          row.archive_date.includes(query) || String(row.clip_number) === query;
      });
      return { table: state.table, columns: table.columns, total: rows.length,
        offset: state.offset, limit: state.limit,
        rows: rows.slice(state.offset, state.offset + state.limit) };
    }

    function syncRadioControls() {
      const visible = radioTables.has(state.table);
      document.getElementById('month-control').hidden = !visible;
      document.getElementById('talkgroup-control').hidden = !visible;
    }

    async function load() {
      syncRadioControls();
      const current = ++request;
      summary.classList.remove('error');
      summary.textContent = 'Loading…';
      try {
        const result = await getRows();
        if (current !== request) return;
        head.replaceChildren(); body.replaceChildren();
        const header = document.createElement('tr');
        for (const column of result.columns) {
          const cell = document.createElement('th'); cell.scope = 'col'; cell.textContent = column; header.append(cell);
        }
        head.append(header);
        for (const row of result.rows) {
          const tr = document.createElement('tr');
          if (row.is_primary === 1) tr.className = 'primary';
          for (const column of result.columns) {
            const td = document.createElement('td');
            if (column === 'id' && state.table === 'officers') {
              const link = document.createElement('button'); link.type = 'button';
              link.textContent = row.id; link.title = `View names for officer ${row.id}`;
              link.addEventListener('click', () => {
                state.table = 'officer_names'; state.officerId = row.id; state.offset = 0;
                state.search = ''; searchInput.value = ''; tableSelect.value = state.table; load();
              });
              td.append(link);
            } else if (column === 'is_primary' && row[column] === 1) {
              const badge = document.createElement('span'); badge.className = 'badge';
              badge.textContent = 'Primary'; td.append(badge);
            } else {
              td.textContent = row[column] === null ? '—' : String(row[column]);
              if (row[column] === null) td.className = 'empty';
            }
            tr.append(td);
          }
          body.append(tr);
        }
        const first = result.total ? result.offset + 1 : 0;
        summary.textContent = `${state.table}: ${first}–${result.offset + result.rows.length} of ${result.total}` +
          (state.officerId === null ? '' : ` · officer #${state.officerId}`) +
          (radioTables.has(state.table) ? ` · ${state.month}${state.talkgroup ? ` · ${state.talkgroup}` : ''}` : '');
        clearFilter.hidden = state.officerId === null;
        page.textContent = `Page ${Math.floor(result.offset / result.limit) + 1}`;
        previous.disabled = result.offset === 0;
        next.disabled = result.offset + result.rows.length >= result.total;
      } catch (error) {
        if (current === request) { summary.textContent = error.message; summary.classList.add('error'); }
      }
    }

    tableSelect.addEventListener('change', () => {
      state.table = tableSelect.value; state.officerId = null; state.offset = 0;
      load();
    });
    monthSelect.addEventListener('change', () => { state.month = monthSelect.value; state.offset = 0; load(); });
    talkgroupSelect.addEventListener('change', () => { state.talkgroup = talkgroupSelect.value; state.offset = 0; load(); });
    let debounce;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { state.search = searchInput.value; state.offset = 0; load(); }, 180);
    });
    clearFilter.addEventListener('click', () => { state.officerId = null; state.offset = 0; load(); });
    previous.addEventListener('click', () => { state.offset -= state.limit; load(); });
    next.addEventListener('click', () => { state.offset += state.limit; load(); });
    initializePeriods().then(load).catch(error => {
      summary.textContent = error.message; summary.classList.add('error');
    });
  </script>
</body>
</html>
